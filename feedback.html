<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
</head>

<body>
    <header>
        <h1>Feedback Form</h1>

        <nav>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="course.html">Courses</a></li>
                <li><a href="feedback.html">Feedback</a></li>
                <li><a href="grade.html">Grades</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <hr>

    <main>
        <h2>Share Your Feedback</h2>
        <p>Please fill in the form below to share your thoughts about courses and the portal.</p>

        <form>
            <fieldset>
                <legend>feedback details </legend>

                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name" placeholder="you@example.com"><br><br>

                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email"><br><br>

                <label for="phone">Phone:</label><br>
                <input type="tel" id="phone" name="phone"><br><br>

                <label>Gender:</label><br>
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>

                <input type="radio" id="other" name="gender" value="other">
                <label for="other">Other</label>

                <br><br>

                <label for="course">Select Course:</label>
                <br>
                <select id="course" name="course">
                    <option value="">HTML & Web Fundamentals</option>
                    <option value="html">HTML</option>
                    <option value="css">CSS</option>
                    <option value="javascript">JavaScript</option>
                    <option value="mysql">MySQL</option>
                </select>

                <br><br>

                <label for="feedback">Your Feedback</label>
                <br>
                 <textarea name="feedback" id="feedback"></textarea>

                <br><br>

                <label for="rating">Rate The Portal</label>
                <br>
                <select id="rating" name="rating">
                    <option>5 - Excellent</option>
                    <option>4 - Very Good</option>
                    <option>3 - Good</option>
                    <option>2 - Fair</option>
                    <option>1 - Poor</option>
                </select>

                <br><br>

                <input type="checkbox" id="subscribe" name="subscribe">
                <label for="subscribe">Subscribe To Newsletter And Updates</label>

                <br><br>

                <button type="submit">Submit</button>
                <button type="reset">Reset</button>
            </fieldset>
        </form>
    </main>

    <hr>

    <footer>
        <p>&copy; 2026 Student Portal. All rights reserved.</p>
    </footer>

</body>

</html>
